<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>All Users - Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="d-flex">
    <nav class="sidebar">
        <div class="sidebar-logo"><span class="logo-icon">🏥</span><div><h5>MedSystem</h5><small>Admin Panel</small></div></div>
        <div class="sidebar-menu">
            <a th:href="@{/admin/dashboard}"><span class="menu-icon">🏠</span> Dashboard</a>
            <a th:href="@{/admin/medicines}"><span class="menu-icon">💊</span> Medicines</a>
            <a th:href="@{/admin/requests}"><span class="menu-icon">📋</span> Purchase Requests</a>
            <a th:href="@{/admin/supply}"><span class="menu-icon">🚚</span> Supply to Dealer</a>
            <a th:href="@{/admin/dealers}"><span class="menu-icon">🤝</span> Manage Dealers</a>
            <a th:href="@{/admin/users}" class="active"><span class="menu-icon">👥</span> All Users</a>
            <a th:href="@{/admin/transactions}"><span class="menu-icon">📊</span> Transactions</a>
            <a th:href="@{/admin/suggestions}"><span class="menu-icon">💬</span> Suggestions</a>
        </div>
        <div class="sidebar-footer">
            <form th:action="@{/logout}" method="post">
                <button type="submit" class="btn btn-sm btn-outline-light w-100">🚪 Logout</button>
            </form>
        </div>
    </nav>

    <div class="main-content">
        <div class="topbar"><span class="topbar-title">👥 All Users</span></div>
        <div class="content-area">
            <div class="card">
                <div class="card-header bg-primary text-white">All Registered Users</div>
                <div class="card-body p-0">
                    <table class="table table-hover mb-0">
                        <thead><tr><th>Licence No</th><th>Name</th><th>Email</th><th>Role</th><th>District</th><th>Status</th></tr></thead>
                        <tbody>
                        <tr th:each="u : ${users}">
                            <td th:text="${u.licenceNumber}"></td>
                            <td th:text="${u.fullName}"></td>
                            <td th:text="${u.email}"></td>
                            <td>
                                <span th:class="${u.role.name() == 'ADMIN'} ? 'role-badge role-admin' :
                                               (${u.role.name() == 'DEALER'} ? 'role-badge role-dealer' :
                                               (${u.role.name() == 'HOSPITAL'} ? 'role-badge role-hospital' : 'role-badge role-shop'))"
                                      th:text="${u.role}"></span>
                            </td>
                            <td th:text="${u.district}"></td>
                            <td>
                                <span th:class="${u.approvalStatus.name() == 'APPROVED'} ? 'badge bg-success' :
                                               (${u.approvalStatus.name() == 'REJECTED'} ? 'badge bg-danger' : 'badge bg-warning text-dark')"
                                      th:text="${u.approvalStatus}"></span>
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
