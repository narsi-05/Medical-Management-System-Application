<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"><title>Send Suggestion - Dealer</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="d-flex">
    <nav class="sidebar">
        <div class="sidebar-logo"><span class="logo-icon">🤝</span><div><h5>MedSystem</h5><small>Dealer Panel</small></div></div>
        <div class="sidebar-menu">
            <a th:href="@{/dealer/dashboard}"><span class="menu-icon">🏠</span> Dashboard</a>
            <a th:href="@{/dealer/stock}"><span class="menu-icon">📦</span> My Stock</a>
            <a th:href="@{/dealer/buy}"><span class="menu-icon">🛒</span> Buy from Admin</a>
            <a th:href="@{/dealer/supply}"><span class="menu-icon">🚚</span> Supply to Users</a>
            <a th:href="@{/dealer/users}"><span class="menu-icon">👥</span> Manage Users</a>
            <a th:href="@{/dealer/transactions}"><span class="menu-icon">📊</span> Transactions</a>
            <a th:href="@{/dealer/suggestions}"><span class="menu-icon">💬</span> Suggestions</a>
            <a th:href="@{/dealer/suggestions/send}" class="active"><span class="menu-icon">✉️</span> Send to Admin</a>
        </div>
        <div class="sidebar-footer"><form th:action="@{/logout}" method="post"><button type="submit" class="btn btn-sm btn-outline-light w-100">🚪 Logout</button></form></div>
    </nav>
    <div class="main-content">
        <div class="topbar"><span class="topbar-title">✉️ Send Suggestion to Admin</span></div>
        <div class="content-area">
            <div th:if="${successMsg}" class="alert alert-success" th:text="${successMsg}"></div>
            <div class="form-section" style="max-width:600px;">
                <h5>📤 Send Suggestion</h5>
                <form th:action="@{/dealer/suggestions/send}" method="post">
                    <div class="mb-3">
                        <label class="form-label">Subject *</label>
                        <input type="text" name="subject" class="form-control" placeholder="Brief subject" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Message *</label>
                        <textarea name="message" class="form-control" rows="5" placeholder="Write your suggestion here..." required></textarea>
                    </div>
                    <button type="submit" class="btn btn-success">📤 Send to Admin</button>
                    <a th:href="@{/dealer/suggestions}" class="btn btn-secondary ms-2">Cancel</a>
                </form>
            </div>
        </div>
    </div>
</div>
</body>
</html>
