<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"><title>Transactions - Dealer</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="d-flex">
    <nav class="sidebar">
        <div class="sidebar-logo"><span class="logo-icon">🤝</span><div><h5>MedSystem</h5><small>Dealer Panel</small></div></div>
        <div class="sidebar-menu">
            <a th:href="@{/dealer/dashboard}"><span class="menu-icon">🏠</span> Dashboard</a>
            <a th:href="@{/dealer/stock}"><span class="menu-icon">📦</span> My Stock</a>
            <a th:href="@{/dealer/buy}"><span class="menu-icon">🛒</span> Buy from Admin</a>
            <a th:href="@{/dealer/supply}"><span class="menu-icon">🚚</span> Supply to Users</a>
            <a th:href="@{/dealer/users}"><span class="menu-icon">👥</span> Manage Users</a>
            <a th:href="@{/dealer/transactions}" class="active"><span class="menu-icon">📊</span> Transactions</a>
            <a th:href="@{/dealer/suggestions}"><span class="menu-icon">💬</span> Suggestions</a>
            <a th:href="@{/dealer/suggestions/send}"><span class="menu-icon">✉️</span> Send to Admin</a>
        </div>
        <div class="sidebar-footer"><form th:action="@{/logout}" method="post"><button type="submit" class="btn btn-sm btn-outline-light w-100">🚪 Logout</button></form></div>
    </nav>
    <div class="main-content">
        <div class="topbar"><span class="topbar-title">📊 My Transactions</span></div>
        <div class="content-area">
            <div class="card">
                <div class="card-header bg-success text-white">Transaction History</div>
                <div class="card-body p-0">
                    <table class="table table-hover mb-0">
                        <thead><tr><th>#</th><th>Medicine</th><th>From</th><th>To</th><th>Qty</th><th>Amount</th><th>Type</th><th>Date</th></tr></thead>
                        <tbody>
                        <tr th:each="tx,stat : ${transactions}">
                            <td th:text="${stat.count}"></td>
                            <td th:text="${tx.medicine.name}"></td>
                            <td th:text="${tx.fromUser.fullName}"></td>
                            <td th:text="${tx.toUser.fullName}"></td>
                            <td th:text="${tx.quantity}"></td>
                            <td th:text="${'₹' + #numbers.formatDecimal(tx.totalPrice,1,2)}"></td>
                            <td><span class="badge bg-info text-dark" th:text="${tx.type}"></span></td>
                            <td th:text="${#temporals.format(tx.transactionDate,'dd-MM-yyyy HH:mm')}"></td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(transactions)}">
                            <td colspan="8" class="text-center text-muted py-4">No transactions yet</td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
