<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Medicines - Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="d-flex">
    <nav class="sidebar">
        <div class="sidebar-logo">
            <span class="logo-icon">🏥</span>
            <div><h5>MedSystem</h5><small>Admin Panel</small></div>
        </div>
        <div class="sidebar-menu">
            <a th:href="@{/admin/dashboard}"><span class="menu-icon">🏠</span> Dashboard</a>
            <a th:href="@{/admin/medicines}" class="active"><span class="menu-icon">💊</span> Medicines</a>
            <a th:href="@{/admin/requests}"><span class="menu-icon">📋</span> Purchase Requests</a>
            <a th:href="@{/admin/supply}"><span class="menu-icon">🚚</span> Supply to Dealer</a>
            <a th:href="@{/admin/dealers}"><span class="menu-icon">🤝</span> Manage Dealers</a>
            <a th:href="@{/admin/users}"><span class="menu-icon">👥</span> All Users</a>
            <a th:href="@{/admin/transactions}"><span class="menu-icon">📊</span> Transactions</a>
            <a th:href="@{/admin/suggestions}"><span class="menu-icon">💬</span> Suggestions</a>
        </div>
        <div class="sidebar-footer">
            <form th:action="@{/logout}" method="post">
                <button type="submit" class="btn btn-sm btn-outline-light w-100">🚪 Logout</button>
            </form>
        </div>
    </nav>

    <div class="main-content">
        <div class="topbar">
            <span class="topbar-title">💊 Manage Medicines</span>
        </div>
        <div class="content-area">
            <div th:if="${successMsg}" class="alert alert-success" th:text="${successMsg}"></div>
            <div th:if="${errorMsg}" class="alert alert-danger" th:text="${errorMsg}"></div>

            <!-- Low Stock Alert -->
            <div th:if="${!#lists.isEmpty(lowStockMedicines)}" class="alert-low-stock mb-3">
                ⚠️ Low stock: <span th:each="m,stat : ${lowStockMedicines}">
                    <strong th:text="${m.name}"></strong> (<span th:text="${m.quantity}"></span>)<span th:if="!${stat.last}">, </span>
                </span>
            </div>

            <!-- Add / Edit Form -->
            <div class="form-section">
                <h5 th:text="${medicine.id != null} ? '✏️ Edit Medicine' : '➕ Add New Medicine'">Add Medicine</h5>
                <form th:action="${medicine.id != null} ? @{/admin/medicines/update/{id}(id=${medicine.id})} : @{/admin/medicines/add}"
                      method="post" th:object="${medicine}">
                    <div class="row g-3">
                        <div class="col-md-4">
                            <label class="form-label">Medicine Name *</label>
                            <input type="text" th:field="*{name}" class="form-control" placeholder="Medicine name" required>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">Manufacturer</label>
                            <input type="text" th:field="*{manufacturer}" class="form-control" placeholder="Manufacturer">
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">Category</label>
                            <input type="text" th:field="*{category}" class="form-control" placeholder="e.g. Antibiotic">
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">Quantity *</label>
                            <input type="number" th:field="*{quantity}" class="form-control" min="0" required>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">Price (₹)</label>
                            <input type="number" th:field="*{price}" class="form-control" step="0.01" min="0">
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">Expiry Date</label>
                            <input type="date" th:field="*{expiryDate}" class="form-control">
                        </div>
                        <div class="col-md-12">
                            <label class="form-label">Description</label>
                            <textarea th:field="*{description}" class="form-control" rows="2" placeholder="Description"></textarea>
                        </div>
                        <div class="col-12">
                            <button type="submit" class="btn btn-primary">
                                <span th:text="${medicine.id != null} ? '💾 Update' : '➕ Add Medicine'">Add</span>
                            </button>
                            <a th:href="@{/admin/medicines}" class="btn btn-secondary ms-2">Cancel</a>
                        </div>
                    </div>
                </form>
            </div>

            <!-- Medicines Table -->
            <div class="card">
                <div class="card-header bg-primary text-white">All Medicines</div>
                <div class="card-body p-0">
                    <table class="table table-hover mb-0">
                        <thead>
                        <tr><th>Name</th><th>Category</th><th>Manufacturer</th><th>Qty</th><th>Price</th><th>Expiry</th><th>Actions</th></tr>
                        </thead>
                        <tbody>
                        <tr th:each="med : ${medicines}">
                            <td th:text="${med.name}"></td>
                            <td th:text="${med.category}"></td>
                            <td th:text="${med.manufacturer}"></td>
                            <td>
                                <span th:class="${med.lowStock} ? 'badge bg-danger' : 'badge bg-success'"
                                      th:text="${med.quantity}"></span>
                                <small th:if="${med.lowStock}" class="text-danger ms-1">⚠️ Low</small>
                            </td>
                            <td th:text="${'₹' + med.price}"></td>
                            <td th:text="${med.expiryDate}"></td>
                            <td>
                                <a th:href="@{/admin/medicines/edit/{id}(id=${med.id})}"
                                   class="btn btn-sm btn-warning">✏️</a>
                                <a th:href="@{/admin/medicines/delete/{id}(id=${med.id})}"
                                   class="btn btn-sm btn-danger"
                                   onclick="return confirm('Delete this medicine?')">🗑️</a>
                            </td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(medicines)}">
                            <td colspan="7" class="text-center text-muted py-4">No medicines added yet</td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
