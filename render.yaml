# Render does not offer a managed MySQL database, so this app now expects
# an external MySQL instance (e.g. PlanetScale, Aiven, AWS RDS, your own server).
# Set the values below in the Render dashboard as environment variables.
services:
  - type: web
    name: medical-management-system
    runtime: docker
    plan: free
    dockerContext: MedicalManagementSystemApplication
    dockerfilePath: MedicalManagementSystemApplication/Dockerfile
    envVars:
      - key: SPRING_DATASOURCE_URL
        value: jdbc:mysql://altaria.proxy.rlwy.net:46264/railway?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
        sync: false
      - key: SPRING_DATASOURCE_USERNAME
        value: root
        sync: false
      - key: SPRING_DATASOURCE_PASSWORD
        value: jLgkyCNaLRJwwRGYEGOxvlEdqVaOFUvS
        sync: false
      - key: SPRING_DATASOURCE_DRIVER_CLASS_NAME
        value: com.mysql.cj.jdbc.Driver
        sync: false
      - key: SPRING_JPA_DIALECT
        value: org.hibernate.dialect.MySQLDialect
        sync: false
