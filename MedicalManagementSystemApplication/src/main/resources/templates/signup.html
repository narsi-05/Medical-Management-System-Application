<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Signup - Medical Management System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <style>
        .auth-wrapper { background: linear-gradient(135deg, #6610f2 0%, #0d6efd 100%); }
        .auth-header { background: linear-gradient(135deg, #6610f2, #0d6efd); }
        .btn-auth { background: linear-gradient(135deg, #6610f2, #0d6efd); }
    </style>
</head>
<body>
<div class="auth-wrapper">
    <div class="auth-card">
        <div class="auth-header">
            <div class="logo">🔑</div>
            <h2>Set Your Password</h2>
            <p>Complete your account setup</p>
        </div>
        <div class="auth-body">
            <div th:if="${errorMsg}" class="alert alert-danger rounded-3" th:text="${errorMsg}"></div>
            <div th:if="${successMsg}" class="alert alert-success rounded-3" th:text="${successMsg}"></div>

            <form th:action="@{/signup}" method="post">
                <div class="mb-3">
                    <label class="form-label">Licence Number</label>
                    <input type="text" name="licenceNumber" class="form-control"
                           placeholder="Your registered licence number" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Email</label>
                    <input type="email" name="email" class="form-control"
                           placeholder="Your registered email" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Create Password</label>
                    <input type="password" name="password" id="password" class="form-control"
                           placeholder="Minimum 6 characters" required minlength="6">
                </div>
                <div class="mb-4">
                    <label class="form-label">Confirm Password</label>
                    <input type="password" name="confirmPassword" id="confirmPassword" class="form-control"
                           placeholder="Re-enter password" required>
                </div>
                <button type="submit" class="btn-auth">✅ Set Password</button>
            </form>

            <div class="auth-links mt-3">
                <a th:href="@{/register}">New User? Go to Registration</a> &nbsp;|&nbsp;
                <a th:href="@{/login}">Already Signed Up? Go to Login</a>
            </div>
        </div>
    </div>
</div>
<script>
document.querySelector('form').onsubmit = function() {
    if (document.getElementById('password').value !== document.getElementById('confirmPassword').value) {
        alert('Passwords do not match!'); return false;
    }
};
</script>
</body>
</html>
