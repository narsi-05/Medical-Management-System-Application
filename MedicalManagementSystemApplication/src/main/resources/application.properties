# Application Name
spring.application.name=MedicalManagementSystem

# Server Port (Render injects PORT at runtime)
server.port=${PORT:8080}

# Database Configuration
# Fall back to an in-memory H2 database if no custom MySQL environment variables are provided.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:medical_db;DB_CLOSE_DELAY=-1;MODE=MySQL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER_CLASS:org.h2.Driver}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=${SPRING_JPA_DIALECT:org.hibernate.dialect.H2Dialect}
spring.jpa.properties.hibernate.format_sql=true

# Run schema.sql on startup (schema is now managed via SQL, not Hibernate auto-generation)
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true

# Thymeleaf
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html

# Logging
logging.level.com.medical=DEBUG
