<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"><title>Supply - Dealer</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="d-flex">
    <nav class="sidebar">
        <div class="sidebar-logo"><span class="logo-icon">🤝</span><div><h5>MedSystem</h5><small>Dealer Panel</small></div></div>
        <div class="sidebar-menu">
            <a th:href="@{/dealer/dashboard}"><span class="menu-icon">🏠</span> Dashboard</a>
            <a th:href="@{/dealer/stock}"><span class="menu-icon">📦</span> My Stock</a>
            <a th:href="@{/dealer/buy}"><span class="menu-icon">🛒</span> Buy from Admin</a>
            <a th:href="@{/dealer/supply}" class="active"><span class="menu-icon">🚚</span> Supply to Users</a>
            <a th:href="@{/dealer/users}"><span class="menu-icon">👥</span> Manage Users</a>
            <a th:href="@{/dealer/transactions}"><span class="menu-icon">📊</span> Transactions</a>
            <a th:href="@{/dealer/suggestions}"><span class="menu-icon">💬</span> Suggestions</a>
            <a th:href="@{/dealer/suggestions/send}"><span class="menu-icon">✉️</span> Send to Admin</a>
        </div>
        <div class="sidebar-footer"><form th:action="@{/logout}" method="post"><button type="submit" class="btn btn-sm btn-outline-light w-100">🚪 Logout</button></form></div>
    </nav>
    <div class="main-content">
        <div class="topbar"><span class="topbar-title">🚚 Supply Medicine to Hospitals/Shops</span></div>
        <div class="content-area">
            <div th:if="${successMsg}" class="alert alert-success" th:text="${successMsg}"></div>
            <div th:if="${errorMsg}" class="alert alert-danger" th:text="${errorMsg}"></div>

            <div class="form-section">
                <h5>📦 Supply Medicine</h5>
                <form th:action="@{/dealer/supply}" method="post">
                    <div class="row g-3">
                        <div class="col-md-4">
                            <label class="form-label">Select Buyer *</label>
                            <select name="userId" class="form-select" required>
                                <option value="">-- Select Hospital / Medical Shop --</option>
                                <optgroup label="Hospitals">
                                    <option th:each="h : ${hospitals}" th:value="${h.id}"
                                            th:text="${h.fullName + ' (' + h.licenceNumber + ')'}"></option>
                                </optgroup>
                                <optgroup label="Medical Shops">
                                    <option th:each="s : ${shops}" th:value="${s.id}"
                                            th:text="${s.fullName + ' (' + s.licenceNumber + ')'}"></option>
                                </optgroup>
                            </select>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">Select Medicine *</label>
                            <select name="medicineId" class="form-select" required>
                                <option value="">-- Select Medicine --</option>
                                <option th:each="s : ${dealerStock}" th:value="${s.medicine.id}"
                                        th:text="${s.medicine.name + ' (Your Stock: ' + s.quantity + ')'}"></option>
                            </select>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">Quantity *</label>
                            <input type="number" name="quantity" class="form-control" min="1" placeholder="Qty" required>
                        </div>
                        <div class="col-12">
                            <button type="submit" class="btn btn-success">🚚 Supply Now</button>
                        </div>
                    </div>
                </form>
            </div>

            <div class="card">
                <div class="card-header bg-success text-white">📦 Your Current Stock</div>
                <div class="card-body p-0">
                    <table class="table table-hover mb-0">
                        <thead><tr><th>Medicine</th><th>Your Stock</th><th>Status</th></tr></thead>
                        <tbody>
                        <tr th:each="s : ${dealerStock}">
                            <td th:text="${s.medicine.name}"></td>
                            <td th:text="${s.quantity}"></td>
                            <td><span th:class="${s.lowStock} ? 'badge bg-danger' : 'badge bg-success'"
                                      th:text="${s.lowStock} ? 'Low Stock' : 'OK'"></span></td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(dealerStock)}">
                            <td colspan="3" class="text-center text-muted py-3">No stock available</td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
