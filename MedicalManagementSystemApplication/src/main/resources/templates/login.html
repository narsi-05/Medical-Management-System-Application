<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Login - Medical Management System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="auth-wrapper">
    <div class="auth-card">
        <div class="auth-header">
            <div class="logo">🏥</div>
            <h2>Medical Management System</h2>
            <p>Sign in to your account</p>
        </div>
        <div class="auth-body">
            <div th:if="${error}" class="alert alert-danger rounded-3" role="alert">
                <span th:text="${error}"></span>
            </div>
            <div th:if="${message}" class="alert alert-success rounded-3" role="alert">
                <span th:text="${message}"></span>
            </div>
            <form th:action="@{/login}" method="post">
                <div class="mb-3">
                    <label class="form-label">Licence Number</label>
                    <input type="text" name="licenceNumber" class="form-control"
                           placeholder="Enter your licence number" required>
                </div>
                <div class="mb-4">
                    <label class="form-label">Password</label>
                    <input type="password" name="password" class="form-control"
                           placeholder="Enter your password" required>
                </div>
                <button type="submit" class="btn-auth">🔐 Login</button>
            </form>
            <div class="auth-links mt-3">
                <a th:href="@{/register}">New User? Go to Registration</a>
            </div>
            <hr class="my-3">
            <div class="text-center text-muted" style="font-size:0.8rem;">
                <strong>Default Admin:</strong> ADMIN001 / admin@123
            </div>
        </div>
    </div>
</div>
</body>
</html>
