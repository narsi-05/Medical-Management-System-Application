<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"><title>Suggestions - Dealer</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="d-flex">
    <nav class="sidebar">
        <div class="sidebar-logo"><span class="logo-icon">🤝</span><div><h5>MedSystem</h5><small>Dealer Panel</small></div></div>
        <div class="sidebar-menu">
            <a th:href="@{/dealer/dashboard}"><span class="menu-icon">🏠</span> Dashboard</a>
            <a th:href="@{/dealer/stock}"><span class="menu-icon">📦</span> My Stock</a>
            <a th:href="@{/dealer/buy}"><span class="menu-icon">🛒</span> Buy from Admin</a>
            <a th:href="@{/dealer/supply}"><span class="menu-icon">🚚</span> Supply to Users</a>
            <a th:href="@{/dealer/users}"><span class="menu-icon">👥</span> Manage Users</a>
            <a th:href="@{/dealer/transactions}"><span class="menu-icon">📊</span> Transactions</a>
            <a th:href="@{/dealer/suggestions}" class="active"><span class="menu-icon">💬</span> Suggestions</a>
            <a th:href="@{/dealer/suggestions/send}"><span class="menu-icon">✉️</span> Send to Admin</a>
        </div>
        <div class="sidebar-footer"><form th:action="@{/logout}" method="post"><button type="submit" class="btn btn-sm btn-outline-light w-100">🚪 Logout</button></form></div>
    </nav>
    <div class="main-content">
        <div class="topbar"><span class="topbar-title">💬 Suggestions Received</span></div>
        <div class="content-area">
            <div th:if="${#lists.isEmpty(suggestions)}" class="text-center py-5 text-muted">
                <div style="font-size:3rem;">📭</div><p>No suggestions received yet.</p>
            </div>
            <div th:each="s : ${suggestions}" class="card mb-3">
                <div class="card-header d-flex justify-content-between">
                    <span>📨 From: <strong th:text="${s.fromUser.fullName}"></strong>
                        <span class="ms-2 badge bg-secondary" th:text="${s.fromUser.role}"></span>
                    </span>
                    <small class="text-muted" th:text="${#temporals.format(s.createdAt,'dd-MM-yyyy HH:mm')}"></small>
                </div>
                <div class="card-body">
                    <h6 class="fw-bold" th:text="${'Subject: ' + s.subject}"></h6>
                    <p th:text="${s.message}" class="mb-0 text-muted"></p>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
