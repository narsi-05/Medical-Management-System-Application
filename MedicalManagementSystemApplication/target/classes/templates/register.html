<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Register - Medical Management System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <style>
        .auth-wrapper { background: linear-gradient(135deg, #198754 0%, #20c997 50%, #0d6efd 100%); }
        .auth-header { background: linear-gradient(135deg, #198754, #20c997); }
        .btn-auth { background: linear-gradient(135deg, #198754, #20c997); }
        .auth-card { max-width: 600px; }
    </style>
</head>
<body>
<div class="auth-wrapper">
    <div class="auth-card">
        <div class="auth-header">
            <div class="logo">📋</div>
            <h2>New User Registration</h2>
            <p>Register as Dealer, Hospital or Medical Shop</p>
        </div>
        <div class="auth-body">
            <div th:if="${errorMsg}" class="alert alert-danger rounded-3" th:text="${errorMsg}"></div>
            <div th:if="${successMsg}" class="alert alert-success rounded-3" th:text="${successMsg}"></div>

            <form th:action="@{/register}" method="post" th:object="${user}">
                <div class="row g-3">
                    <div class="col-md-6">
                        <label class="form-label">Licence Number *</label>
                        <input type="text" th:field="*{licenceNumber}" class="form-control"
                               placeholder="e.g. DLR001" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Email *</label>
                        <input type="email" th:field="*{email}" class="form-control"
                               placeholder="Enter email" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">First Name *</label>
                        <input type="text" th:field="*{firstName}" class="form-control"
                               placeholder="First name" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Last Name *</label>
                        <input type="text" th:field="*{lastName}" class="form-control"
                               placeholder="Last name" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Mobile Number *</label>
                        <input type="text" th:field="*{mobileNumber}" class="form-control"
                               placeholder="10-digit mobile" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Profession *</label>
                        <select th:field="*{role}" class="form-select" required>
                            <option value="">Select Profession</option>
                            <option value="DEALER">Dealer</option>
                            <option value="HOSPITAL">Hospital</option>
                            <option value="MEDICAL_SHOP">Medical Shop</option>
                        </select>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Village</label>
                        <input type="text" th:field="*{village}" class="form-control" placeholder="Village">
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Mandal</label>
                        <input type="text" th:field="*{mandal}" class="form-control" placeholder="Mandal">
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">District</label>
                        <input type="text" th:field="*{district}" class="form-control" placeholder="District">
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">State</label>
                        <input type="text" th:field="*{state}" class="form-control" placeholder="State">
                    </div>
                </div>

                <button type="submit" class="btn-auth mt-4">📝 Register Now</button>
            </form>

            <div class="auth-links mt-3">
                <a th:href="@{/signup}">Already Registered? Go to Signup</a> &nbsp;|&nbsp;
                <a th:href="@{/login}">Go to Login</a>
            </div>
        </div>
    </div>
</div>
</body>
</html>
