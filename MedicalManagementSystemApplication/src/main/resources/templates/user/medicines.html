<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"><title>Medicines</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="d-flex">
    <nav class="sidebar">
        <div class="sidebar-logo"><span class="logo-icon">🏥</span><div><h5>MedSystem</h5><small>User Panel</small></div></div>
        <div class="sidebar-menu">
            <a th:href="@{/user/dashboard}"><span class="menu-icon">🏠</span> Dashboard</a>
            <a th:href="@{/user/medicines}" class="active"><span class="menu-icon">💊</span> View Medicines</a>
            <a th:href="@{/user/stock}"><span class="menu-icon">📦</span> My Stock</a>
            <a th:href="@{/user/transactions}"><span class="menu-icon">📊</span> Transactions</a>
            <a th:href="@{/user/suggestions}"><span class="menu-icon">💬</span> Send Suggestion</a>
        </div>
        <div class="sidebar-footer"><form th:action="@{/logout}" method="post"><button type="submit" class="btn btn-sm btn-outline-light w-100">🚪 Logout</button></form></div>
    </nav>
    <div class="main-content">
        <div class="topbar"><span class="topbar-title">💊 Available Medicines</span></div>
        <div class="content-area">
            <div class="alert alert-info">
                ℹ️ To purchase medicines, please contact your assigned Dealer. They will supply medicines to your account.
            </div>
            <div class="row g-3">
                <div class="col-md-4" th:each="m : ${medicines}">
                    <div class="medicine-card">
                        <div class="d-flex justify-content-between align-items-start mb-2">
                            <span class="med-name" th:text="${m.name}"></span>
                            <span th:class="${m.lowStock} ? 'med-qty qty-low' : 'med-qty qty-ok'"
                                  th:text="${'Qty: ' + m.quantity}"></span>
                        </div>
                        <div class="text-muted small" th:text="${m.manufacturer}"></div>
                        <div class="text-muted small" th:text="${m.category}"></div>
                        <div class="mt-2 fw-bold text-success" th:text="${'₹' + m.price}"></div>
                        <div th:if="${m.expiryDate}" class="small text-muted">
                            Expiry: <span th:text="${m.expiryDate}"></span>
                        </div>
                    </div>
                </div>
                <div th:if="${#lists.isEmpty(medicines)}" class="col-12 text-center text-muted py-5">
                    <div style="font-size:3rem;">💊</div>
                    <p>No medicines available.</p>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
